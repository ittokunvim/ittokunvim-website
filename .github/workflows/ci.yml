name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# 同じブランチで新しく push されたら、古い実行は止める
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: 1

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run lint

      # 環境変数は設定しない。外部 JSON の URL が未設定でも静的ビルドが成功することを確かめる
      - run: npm run build
